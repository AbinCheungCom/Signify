# Signify Nginx 配置（传统服务器）
# 适用于：Nginx 1.28+ / MySQL 5.7+ / PHP 8.0+

server {
    listen 80;
    server_name 你的域名或IP;
    root /www/wwwroot/signify/public;
    index index.php;

    charset utf-8;

    # 上传文件大小限制（头像最大 2MB，留余量）
    client_max_body_size 10M;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection 已废弃，现代浏览器使用 Content-Security-Policy 替代
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.cn https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.cn https://fonts.gstatic.com; img-src 'self' data:;" always;
    # 全站启用 HTTPS 后建议放开 HSTS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求日志
    access_log /www/wwwroot/signify/storage/logs/access.log;
    error_log /www/wwwroot/signify/storage/logs/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # PHP-FPM（传统服务器常见配置）
    # 注意：部分面板使用 /tmp/php-cgi.sock 或 127.0.0.1:9000，请根据实际修改
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi.sock;
        # 或使用 TCP 连接（注释上面一行，取消下面两行）:
        # fastcgi_pass 127.0.0.1:9000;
        # fastcgi_keep_conn on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # 静态资源缓存
    # 注意：nginx 的 add_header 不向下继承——本块自带 add_header 后，
    # 父级的 X-Frame-Options/X-Content-Type-Options/CSP 需在此重复声明。
    # webp/avif 为头像上传支持的格式，必须列入正则，否则会被下方 uploads 说明中的规则挡成 404。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.cn https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.cn https://fonts.gstatic.com; img-src 'self' data:;" always;
    }

    # 禁止访问敏感文件和隐藏文件
    location ~ /\. {
        deny all;
    }

    # 说明：/storage/*（头像/形象照/微信二维码）是公开静态资源，
    # 经 public/storage 符号链接由上方静态资源规则正常服务；
    # 切勿对其设置 internal，否则未列入静态正则的扩展名（如 webp）会 404。

    # Gzip 压缩（低配服务器建议开启）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
