# Signify Docker 专用 Nginx 配置
# 容器内路径为 /var/www（与传统服务器 /www/wwwroot/signify 不同，勿混用 deploy/nginx.conf）
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;

    # 上传文件大小限制（头像最大 2MB，留余量）
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # 静态资源缓存（webp/avif 为头像上传支持的格式）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问敏感文件和隐藏文件
    location ~ /\. {
        deny all;
    }
}
