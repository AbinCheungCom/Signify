# Signify 本地/演示环境（生产部署请按 README 走传统服务器方案）
# 用法：docker compose up -d --build   访问 http://localhost
# 首次启动自动完成 .env / key:generate / migrate / storage:link

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: signify-app
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-signify}
      DB_USERNAME: ${DB_USERNAME:-signify}
      DB_PASSWORD: ${DB_PASSWORD:-signify_password}
    volumes:
      - site_files:/var/www/public
      - upload_data:/var/www/storage/app/public
    depends_on:
      - db
    networks:
      - signify

  nginx:
    image: nginx:alpine
    container_name: signify-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - site_files:/var/www/public:ro
      - upload_data:/var/www/storage/app/public:ro
    depends_on:
      - app
    networks:
      - signify

  db:
    image: mysql:8.0
    container_name: signify-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-signify}
      MYSQL_USER: ${DB_USERNAME:-signify}
      MYSQL_PASSWORD: ${DB_PASSWORD:-signify_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-signify_root_password}
    volumes:
      - db_data:/var/lib/mysql
    # 默认不对外暴露端口，避免弱口令数据库暴露在公网；需要时取消下行注释并改成强密码
    # ports:
    #   - "127.0.0.1:3306:3306"
    networks:
      - signify

volumes:
  db_data:
  site_files:
  upload_data:

networks:
  signify:
    driver: bridge
